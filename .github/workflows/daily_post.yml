name: 블로그 자동 발행

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 자동 발행 실행
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          WP_CLIENT_ID:      ${{ secrets.WP_CLIENT_ID }}
          WP_CLIENT_SECRET:  ${{ secrets.WP_CLIENT_SECRET }}
          WP_AUTH_CODE:      ${{ secrets.WP_AUTH_CODE }}
          WP_ACCESS_TOKEN:   ${{ secrets.WP_ACCESS_TOKEN }}
        run: python ${{ github.workspace }}/scripts/auto_post.py
        run: |
          pwd
          find . -name "auto_post.py"
          python $(find . -name "auto_post.py")
